<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Sahafi Rent Book — who ate, who paid, who still owes haraa">
  <title>Sahafi Rent Book</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6ecdd"/><stop offset="100%" stop-color="#ecdfcb"/>
    </linearGradient>
    <linearGradient id="terra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9884b"/><stop offset="100%" stop-color="#b2622d"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#86995f"/><stop offset="100%" stop-color="#6f8158"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#46341f" flood-opacity=".16"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="420" rx="28"/></clipPath>

    <!-- Every element is drawn in its finished state; the styles below only
         add motion. Where animation is unavailable the banner still reads. -->
    <style><![CDATA[
      .drift  { animation: drift  19s ease-in-out infinite alternate; }
      .drift2 { animation: drift2 23s ease-in-out infinite alternate; }
      @keyframes drift  { to { transform: translate(48px, 26px) scale(1.10) } }
      @keyframes drift2 { to { transform: translate(-40px,-22px) scale(1.07) } }

      .float { animation: float 5.5s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }

      .sweep { animation: sweep 6s cubic-bezier(.22,.61,.36,1) 1.4s infinite; }
      @keyframes sweep { 0% { transform: translateX(-260px) } 40%,100% { transform: translateX(1340px) } }

      .pulse { animation: pulse 3.4s ease-in-out infinite; transform-origin: 445px 371px; }
      @keyframes pulse { 0%,100% { opacity: .45 } 50% { opacity: 1 } }

      .slide { animation: slide 9s cubic-bezier(.65,0,.35,1) 1s infinite; }
      @keyframes slide {
        0%,17%   { transform: translateX(0) }
        25%,42%  { transform: translateX(114px) }
        50%,67%  { transform: translateX(228px) }
        75%,92%  { transform: translateX(114px) }
        100%     { transform: translateX(0) }
      }

      .settle { opacity: 0; animation: settle 9s linear 1s infinite; }
      @keyframes settle { 0%,58% { opacity: 0 } 66%,92% { opacity: 1 } 100% { opacity: 0 } }

      .caret { animation: caret 1.05s steps(1) infinite; }
      @keyframes caret { 50% { opacity: 0 } }

      @media (prefers-reduced-motion: reduce) {
        .drift,.drift2,.float,.sweep,.pulse,.slide,.caret { animation: none }
        .settle { display: none }
      }
    ]]></style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#ground)"/>
    <g filter="url(#soft)" opacity=".5">
      <circle class="drift"  cx="150"  cy="60"  r="180" fill="#c67139" opacity=".42"/>
      <circle class="drift2" cx="1140" cy="380" r="200" fill="#6f8158" opacity=".34"/>
      <circle class="drift"  cx="980"  cy="10"  r="150" fill="#d9884b" opacity=".26"/>
    </g>

    <!-- brand -->
    <g class="float">
      <rect x="72" y="74" width="66" height="66" rx="21" fill="url(#terra)" filter="url(#lift)"/>
      <text x="105" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="31"
            font-weight="700" fill="#fffaf4" text-anchor="middle">S</text>
    </g>

    <text x="160" y="106" font-family="Georgia, 'Times New Roman', serif" font-size="43"
          font-weight="700" fill="#241f1b" letter-spacing="-.6">Sahafi Rent Book</text>
    <text x="162" y="134" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5"
          fill="#8b8175" letter-spacing="3">BUUGGA DEYNTA</text>

    <text x="72" y="194" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#5d5348">
      Who ate, who paid, who still owes haraa.
    </text>
    <rect class="caret" x="452" y="177" width="2" height="23" fill="#c67139"/>

    <!-- summary cards -->
    <g filter="url(#lift)">
      <rect x="72"  y="234" width="228" height="106" rx="24" fill="#fffdfa" opacity=".94"/>
      <rect x="316" y="234" width="228" height="106" rx="24" fill="#eef4e6" opacity=".96"/>
      <rect x="560" y="234" width="228" height="106" rx="24" fill="#fdf0e6" opacity=".96"/>
    </g>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.7">
      <text x="96"  y="266" fill="#8b8175">TOTAL CONSUMED</text>
      <text x="340" y="266" fill="#6f8158">COLLECTED</text>
      <text x="584" y="266" fill="#8c491a">OUTSTANDING HARAA</text>
    </g>
    <g font-family="Georgia, serif" font-size="34" font-weight="700">
      <text x="96"  y="308" fill="#241f1b">$167</text>
      <text x="340" y="308" fill="#5b6b47">$87</text>
      <text x="584" y="308" fill="#8c491a">$80</text>
    </g>

    <!-- collection rate -->
    <rect x="72" y="366" width="716" height="9" rx="5" fill="#241f1b" opacity=".11"/>
    <rect x="72" y="366" width="373" height="9" rx="5" fill="url(#sage)"/>
    <circle class="pulse" cx="445" cy="371" r="7" fill="#6f8158"/>
    <text x="802" y="376" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#5b6b47">52%</text>

    <!-- glass pill navigation -->
    <g filter="url(#lift)">
      <rect x="856" y="234" width="352" height="60" rx="30" fill="#fffdfa" opacity=".8"/>
    </g>
    <rect class="slide" x="862" y="240" width="114" height="48" rx="24" fill="#c67139" opacity=".17"/>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5d5348">
      <text x="919"  y="269" text-anchor="middle">Home</text>
      <text x="1033" y="269" text-anchor="middle">Book</text>
      <text x="1147" y="269" text-anchor="middle">People</text>
    </g>

    <!-- a record settling -->
    <g>
      <rect x="856" y="318" width="152" height="30" rx="15" fill="#fdf0e6"/>
      <circle cx="876" cy="333" r="4" fill="#8c491a"/>
      <text x="888" y="338" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8c491a">Overdue</text>
      <g class="settle">
        <rect x="856" y="318" width="152" height="30" rx="15" fill="#eef4e6"/>
        <circle cx="876" cy="333" r="4" fill="#5b6b47"/>
        <text x="888" y="338" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b47">Paid in Full</text>
      </g>
    </g>

    <rect class="sweep" x="-260" y="0" width="210" height="420" fill="url(#sheen)" opacity=".28"/>
  </g>
</svg>
