            '<div style="display:flex; align-items:center; gap:9px">' +
              '<button class="linkish" data-act="openCustomer" data-id="' + r.customerId + '" style="margin-right:auto; font-weight:600">' + esc(c.name) + '</button>' +
              '<span data-badgekey="r.' + r.id + '" data-badgeval="' + st + '">' + badge(st) + '</span>' +
            '</div>' +
            '<div class="sub" style="font-size:12.5px">' + esc(r.food) + ' · la qaday ' + dateLabel(r.date) + '</div>' +
            (r.dueDate ? '<div style="font-size:12px; ' + (isOverdue(r) ? 'color:var(--danger-700)' : 'color:var(--ink-2)') + '">' +
              (isOverdue(r) ? F.overdueSince('') : F.expectedOn('')) + dateLong(r.dueDate) + (r.dueTime ? ' — ' + timeLabel(r.dueTime) : '') + '</div>' : '') +
            '<div style="display:flex; align-items:center; gap:9px; flex-wrap:wrap">' +
              '<span class="sub" style="margin-right:auto; font-size:12.5px">' + t('Total') + ' <span class="n">' + money(r.total) +
                '</span> · ' + t('Paid') + ' <span class="n">' + money(r.paid) +
                '</span> · <strong class="n">' + t('Haraa') + ' ' + money(r.total - r.paid) + '</strong></span>' +
              '<button class="btn btn-glass btn-sm" data-act="openPay" data-id="' + r.customerId + '">' + t('Pay') + '</button>' +
              '<button class="btn btn-glass btn-sm" data-act="editRecord" data-id="' + r.id + '">' + t('Edit') + '</button>' +
              '<button class="btn btn-glass btn-sm" data-act="deleteRecord" data-id="' + r.id + '">' + t('Delete') + '</button>' +
            '</div>' +
          '</div>';
        }).join('') + '</div>';
    }

    return '<div class="wrap anim-fade">' +
      '<div class="page-head">' +
        '<div style="margin-right:auto"><h1>' + t('Rent Book') + '</h1>' +
          '<p class="sub">Diiwaanka cuntooyinka iyo deynta maalinlaha ah ee la qaatay.</p></div>' +
        '<button class="btn btn-primary" data-act="openAdd">' + ic('plus', 16, 2.2) + t('Add Record') + '</button>' +
      '</div>' + controls +
      '<section class="sheet" style="padding:6px 18px 10px">' + body + '</section>' +
    '</div>';
  }

  /* ══ customer status overview ═══════════════════════════════════ */
  function viewCustomers(v) {
    const q = S.custSearch.trim().toLowerCase();
    let accs = accounts();
    if (q) accs = accs.filter(a => a.name.toLowerCase().includes(q) || (a.phone || '').includes(q));
    if (S.custFilter === 'Rukun') accs = accs.filter(a => a.isRukun);
    else if (S.custFilter === 'Caadi') accs = accs.filter(a => !a.isRukun);
    else if (S.custFilter !== 'All') accs = accs.filter(a => a.status === S.custFilter);

    const SORTS = {
      recent: (a, b) => (b.lastStamp || '').localeCompare(a.lastStamp || '') || a.name.localeCompare(b.name),
      debt: (a, b) => b.remaining - a.remaining || a.name.localeCompare(b.name),
      due:  (a, b) => {
        const da = a.next ? dueMs(a.next) : Infinity;
        const db = b.next ? dueMs(b.next) : Infinity;
        return da - db || a.name.localeCompare(b.name);
      },
      name: (a, b) => a.name.localeCompare(b.name),
      last: (a, b) => (b.last || '').localeCompare(a.last || '')
    };
    accs = accs.slice().sort(SORTS[S.custSort] || SORTS.recent);

    const all = accounts();
    const counts = {
      All: all.length,
      'Rukun': all.filter(a => a.isRukun).length,
      'Caadi': all.filter(a => !a.isRukun).length,
      'Overdue': all.filter(a => a.status === 'Overdue').length,
      'Unpaid': all.filter(a => a.status === 'Unpaid').length,
      'Partially Paid': all.filter(a => a.status === 'Partially Paid').length,
      'Paid in Full': all.filter(a => a.status === 'Paid in Full').length
    };
    const filters = [
      ['All', 'Dhammaan'],
      ['Rukun', '⭐ Rukunka (Bishii)'],
      ['Caadi', 'Deymaha Maalinlaha'],
      ['Overdue', 'Waqtigii dhaafay'],
      ['Unpaid', 'Lama bixin'],
      ['Partially Paid', 'Qayb ahaan'],
      ['Paid in Full', 'La bixiyay']
    ];

    const sortOptions = [
      ['recent', 'Ugu Dambeeyay'],
      ['debt', 'Haraaga Ugu Weyn'],
      ['due', 'Xilliga Bixinta'],
      ['name', 'Magaca A-Z']
    ];

    const controls =
      '<div style="display:flex; flex-direction:column; gap:12px; margin-bottom:18px">' +
        '<div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center">' +
          '<div class="search-wrap" style="flex:2; min-width:220px">' + ic('search', 16, 2.1) +
            '<input id="custSearch" class="input" type="search" placeholder="Ka raadi magac ama taleefan…" value="' + esc(S.custSearch) + '" aria-label="' + t('Search customers') + '">' +
          '</div>' +
          '<div class="seg" role="group" aria-label="Kala horreysiin" style="flex-wrap:wrap">' +
            '<span style="font-size:11px; font-weight:600; color:var(--ink-3); padding:6px 6px 6px 10px; align-self:center">Kala horree:</span>' +
            sortOptions.map(([k, l]) => '<button class="seg-opt" data-act="setCustSort" data-sort="' + k + '" aria-pressed="' + (S.custSort === k) + '">' +
              l + '</button>').join('') +
          '</div>' +
        '</div>' +
        '<div class="seg" role="group" aria-label="Kala saar macaamiisha">' +
          filters.map(([f, lbl]) => '<button class="seg-opt" data-act="custFilter" data-filter="' + f + '" aria-pressed="' + (S.custFilter === f) + '">' +
            lbl + ' <span style="opacity:.65; font-size:11px">(' + (counts[f] || 0) + ')</span></button>').join('') +
        '</div>' +
      '</div>';

    if (!accs.length) {
      return '<div class="wrap anim-fade">' + custHead(all) + controls +
        '<section class="sheet"><div class="empty">' +
          '<div class="empty-ico">' + ic('people', 30, 1.8) + '</div>' +
          '<h3>' + t('No customers match') + '</h3>' +
          '<p class="sub" style="margin-top:4px">' + t('Try a different name, phone or filter.') + '</p>' +
        '</div></section></div>';
    }

    /* Build a responsive customer card that is 100% visible on ANY device without sliding */
    const renderCard = (a) => {
      const phoneClean = cleanPhone(a.phone);
      return '<div class="cust-card ' + (a.isRukun ? 'cust-card-rukun' : '') + '">' +
        '<div class="cust-card-head">' +
          '<span class="avatar" style="width:44px; height:44px; font-size:16px">' + esc(initials(a.name)) + '</span>' +
          '<div style="margin-right:auto; min-width:0">' +
            '<button class="linkish" data-act="openCustomer" data-id="' + a.id + '" style="font-weight:700; font-size:16px; text-align:left; line-height:1.25; display:block" title="Guji si aad u aragto taariikhda">' +
              esc(a.name) + '</button>' +
            (a.phone ? '<span style="display:block; font-size:12px; color:var(--ink-3); margin-top:2px">' + esc(a.phone) + '</span>' : '') +
            '<div style="margin-top:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap">' +
              rukunBadge(a.isRukun) +
              '<button class="btn btn-quiet btn-sm" data-act="toggleRukun" data-id="' + a.id + '" style="font-size:11px; padding:2px 7px; min-height:24px; color:var(--ink-3)" title="Beddel nooca macmiilka">' +
                (a.isRukun ? 'Beddel: Caadi' : 'Beddel: Rukun ⭐') + '</button>' +
            '</div>' +
          '</div>' +
          '<span data-badgekey="c.' + a.id + '" data-badgeval="' + a.status + '">' + badge(a.status) + '</span>' +
        '</div>' +

        /* 3-metric KPI strip */
        '<div class="cust-card-stats">' +
          '<div>' +
            '<div class="cust-card-stat-label">Wadarta</div>' +
            '<div class="cust-card-stat-val">' + money(a.consumed) + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="cust-card-stat-label">Bixiyay</div>' +
            '<div class="cust-card-stat-val" style="color:var(--sage-600)">' + money(a.paid) + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="cust-card-stat-label">Haraa</div>' +
            '<div class="cust-card-stat-val" style="color:' + (a.remaining > 0.001 ? 'var(--accent-700)' : 'var(--sage-600)') + '">' + money(a.remaining) + '</div>' +
          '</div>' +
        '</div>' +

        (a.next ? '<div style="font-size:12px; ' + (a.nextOverdue ? 'color:var(--danger-700); font-weight:600' : 'color:var(--ink-2)') + '">' +
          (a.nextOverdue ? '⚠️ Waqtigu Dhaafay: ' : '📅 La filayo: ') + dateLong(a.next.dueDate) + (a.next.dueTime ? ' · ' + timeLabel(a.next.dueTime) : '') + '</div>' : '') +

        /* Clean quick recent items summary */
        (a.records.length
          ? '<div style="font-size:12px; color:var(--ink-3); background:var(--solid-2); padding:6px 10px; border-radius:var(--r-sm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis">' +
              '<span>Cuntooyinkii: </span><strong style="color:var(--ink-2)">' + esc(a.records.slice(-2).map(r => r.food).join(', ')) + '</strong>' +
            '</div>'
          : '') +

        /* Full action button bar — ALL BUTTONS PERFECTLY FIT WITH ZERO CLIPPING */
        '<div class="cust-card-actions">' +
          (a.remaining > 0.001
            ? '<button class="btn btn-primary btn-sm" data-act="openPay" data-id="' + a.id + '">' + ic('card', 14, 2) + 'Bixi</button>' +
              '<button class="btn btn-glass btn-sm" data-act="settleFullDebt" data-id="' + a.id + '" title="Hal mar wada xidh haraaga">' + ic('check', 13, 2) + 'Wada Bixi</button>'
            : '<span class="badge badge-paid" style="font-size:11.5px">' + ic('check', 12, 2.2) + 'Dhammaystiran</span>') +
          (a.phone && a.remaining > 0.001 ? '<a href="https://wa.me/' + phoneClean + '?text=' + encodeURIComponent('Asc ' + a.name + ', waxaan kaa soo xasuusinaynaa haraagaaga ' + money(a.remaining) + ' ee ' + (S.profile.name || 'Sahafi') + '.') + '" target="_blank" rel="noopener" class="btn-whatsapp btn-sm" style="text-decoration:none">' + ic('whatsapp', 13, 2) + 'WhatsApp</a>' : '') +
          '<button class="btn btn-glass btn-sm" data-act="openAddFor" data-id="' + a.id + '" title="' + t('Add food') + '">' + ic('plus', 13, 2) + '+ Cunto</button>' +
          '<button class="btn btn-glass btn-sm" data-act="openCustomer" data-id="' + a.id + '" title="Eeg Taariikhda Buuxda">' + ic('user', 13, 2) + 'Eeg</button>' +
          '<button class="btn btn-glass btn-sm danger" data-act="deleteCustomer" data-id="' + a.id + '" title="Tirtir Macmiilka" style="margin-left:auto">' + ic('trash', 13, 2) + 'Tirtir</button>' +
        '</div>' +
      '</div>';
    };

    /* Group into Rukun vs Caadi sections or show filtered list */
    const rukunAccs = accs.filter(a => a.isRukun);
    const caadAccs  = accs.filter(a => !a.isRukun);

    let body = '';
    if (S.custFilter === 'Rukun') {
      body = '<div class="cust-grid">' + rukunAccs.map(renderCard).join('') + '</div>';
    } else if (S.custFilter === 'Caadi') {
      body = '<div class="cust-grid">' + caadAccs.map(renderCard).join('') + '</div>';
    } else {
      /* Split into two clear, clean sections with headers */
      const renderSection = (list, title, color, icon) => {
        if (!list.length) return '';
        return '<div style="margin-bottom:24px">' +
          '<div style="display:flex; align-items:center; gap:8px; margin-bottom:12px; padding-bottom:6px; border-bottom:1.5px solid ' + color + '22">' +
            '<span style="width:10px; height:10px; border-radius:999px; background:' + color + '; flex:none"></span>' +
            '<h2 style="font-size:16px; font-weight:700; color:' + color + '; margin:0">' + icon + ' ' + title + '</h2>' +
            '<span style="font-size:12px; color:var(--ink-3); margin-left:4px">(' + list.length + ' macmiil)</span>' +
          '</div>' +
          '<div class="cust-grid">' +
            list.map(renderCard).join('') +
          '</div>' +
        '</div>';
      };

      body = renderSection(rukunAccs, 'Macaamiisha Rukunka ah (Bishii Bixiya)', 'var(--accent-700)', '⭐') +
             renderSection(caadAccs, 'Deymaha Caadiga ah (Maalinle)', 'var(--ink-1)', '📋');
    }

    return '<div class="wrap anim-fade">' + custHead(all) + controls +
      '<section style="margin-top:6px">' + body + '</section>' +
    '</div>';
  }

    return '<div class="page-head">' +
      '<div style="margin-right:auto"><h1>' + t('Customer Overview') + '</h1>' +
        '<p class="sub">' + F.peopleOnBook(all.length, owing.length, all.length - owing.length, overdue.length) + ' · <strong style="color:var(--accent-700)">' + rukunCount + ' Rukun ah</strong></p></div>' +
      '<button class="btn btn-primary" data-act="openAdd">' + ic('plus', 16, 2.2) + t('Add Record') + '</button>' +
    '</div>';
  }

  /* ══ monthly report ═════════════════════════════════════════════ */
  function viewReport(v) {
    const servedMonths = Array.from(new Set(S.data.records.map(r => r.date.slice(0, 7))))
      .concat(S.data.payments.map(p => p.date.slice(0, 7)))
      .filter(Boolean);
    const keys = Array.from(new Set(servedMonths)).sort().reverse();
    if (!keys.includes(today().slice(0, 7))) keys.unshift(today().slice(0, 7));

    const monthKey = S.month === 'all'
      ? 'all'
      : (S.month && (keys.includes(S.month) || S.month === 'all') ? S.month : (keys[0] || today().slice(0, 7)));
    
    const isAllTime = monthKey === 'all';
    const mLabel = isAllTime ? 'Dhammaan Xilliyada (All Time)' : monthName(monthKey);

    const recs = isAllTime
      ? S.data.records.slice().sort((a, b) => a.date.localeCompare(b.date))
      : S.data.records.filter(r => r.date.startsWith(monthKey)).sort((a, b) => a.date.localeCompare(b.date));
      
    const pays = isAllTime
      ? (S.data.payments || []).slice().sort((a, b) => a.date.localeCompare(b.date))
      : (S.data.payments || []).filter(p => p.date.startsWith(monthKey)).sort((a, b) => a.date.localeCompare(b.date));

    const total = round2(recs.reduce((t, r) => t + r.total, 0));
    const collected = round2(recs.reduce((t, r) => t + r.paid, 0));
    const outstanding = round2(total - collected);
    const rate = total ? Math.round(collected / total * 100) : 0;

    // Open balances
    const expected = S.data.records
      .filter(r => r.total - r.paid > 0.001 && r.dueDate && (isAllTime || r.dueDate.startsWith(monthKey)))
      .sort((a, b) => dueMs(a) - dueMs(b));
    const expectedTotal = round2(expected.reduce((t2, r) => t2 + (r.total - r.paid), 0));

    const mix = { Paid: 0, Partial: 0, Unpaid: 0, Overdue: 0 };
    recs.forEach(r => mix[recStatus(r)]++);

    const custIds = Array.from(new Set(recs.map(r => r.customerId)));
    const monthAccs = custIds.map(id => {
      const rs = recs.filter(r => r.customerId === id);
      const c = custOf(id) || { id, name: 'Unknown', phone: '' };
      const consumed = round2(rs.reduce((t, r) => t + r.total, 0));
      const paid = round2(rs.reduce((t, r) => t + r.paid, 0));
      const rem = round2(consumed - paid);
      const over = rs.filter(isOverdue);
      const dated = rs.filter(r => r.total - r.paid > 0.001 && r.dueDate).sort((a, b) => dueMs(a) - dueMs(b));
      return {
        c, consumed, paid, remaining: rem, count: rs.length,
        status: rem <= 0.001 ? 'Paid in Full' : (over.length ? 'Overdue' : (paid > 0.001 ? 'Partially Paid' : 'Unpaid')),
        next: dated[0] || null
      };
    }).sort((a, b) => b.remaining - a.remaining || a.c.name.localeCompare(b.c.name));

    const settled = monthAccs.filter(a => a.remaining <= 0.001);
    const owing = monthAccs.filter(a => a.remaining > 0.001);

    const picker =
      '<div class="no-print" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; ' +
        'margin:0 auto 16px; max-width:1000px">' +
        '<div style="margin-right:auto"><h1>' + t('Monthly Report') + '</h1>' +
          '<p class="sub">Warbixinta buugga oo midabaysan oo toos PDF looga soo dejisan karo.</p></div>' +
        '<select id="monthSelect" class="input" style="width:auto; min-width:200px" aria-label="' + t('Select report month') + '">' +
          '<option value="all"' + (monthKey === 'all' ? ' selected' : '') + '>📊 Dhammaan (All Time)</option>' +
          keys.map(k => '<option value="' + k + '"' + (k === monthKey ? ' selected' : '') + '>' +
            monthName(k) + '</option>').join('') +
        '</select>' +

        (c.phone ? 
          '<div style="display:flex; gap:8px; align-items:center; padding-top:4px">' +

              ic('whatsapp', 15, 2) + 'U dir WhatsApp</a>' +

  const viewToast = () => !S.toast ? '' :
    '<div id="toast" class="glass anim-rise no-print" role="status" style="position:fixed; z-index:70; left:50%; transform:translateX(-50%); ' +
      'bottom:' + (S.width >= 1024 ? '26px' : 'calc(84px + env(safe-area-inset-bottom))') + '; padding:11px 20px; border-radius:999px; font-size:13px; font-weight:500; max-width:90vw">' +
      esc(S.toast) + '</div>';

  /* ══ actions ════════════════════════════════════════════════════ */
  const blankForm = () =>
    ({ name: '', phone: '', food: '', total: '', paid: '', dueDate: '', dueTime: '', note: '' });

  const actions = {
    go: (el) => {
      S.screen = el.dataset.screen;
      if (S.screen !== 'detail') S.customerId = null;
      render();
    },
    goOverdue: () => { S.screen = 'customers'; S.custFilter = 'Overdue'; S.custSort = 'due'; render(); },
    openCustomer: (el) => { S.screen = 'detail'; S.customerId = el.dataset.id; render(); },
    back: () => { S.screen = 'customers'; S.customerId = null; render(); },
    expand: (el) => { S.expanded = S.expanded === el.dataset.id ? null : el.dataset.id; render(); },

    openAdd: () => { S.dialog = 'form'; S.editId = null; S.form = blankForm(); render(); },
    openQuickAdd: () => { S.dialog = 'quickAdd'; S.editId = null; S.form = blankForm(); render(); },
    openFullForm: () => { S.dialog = 'form'; render(); },
    copyReceipt: (el) => {
      const c = custOf(el.dataset.id || S.payCustomerId);
      if (!c) return;
      const a = account(c);
      const txt = `*Warqadda Lacag-bixinta - ${S.profile.name || 'Sahafi'}*\n👤 Macmiilka: ${a.name}\n📊 Haraaga: ${money(a.remaining)}\n📅 Taariikhda: ${dateLong(today())}`;
      navigator.clipboard.writeText(txt).then(() => {
        toast('Warqadda waa la koobiyeeyay!');
        vibrate(10);
      }).catch(() => toast('Koobiyeyntu ma shaqayn'));
    },
    openAddFor: (el) => {
      const c = custOf(el.dataset.id);
      S.dialog = 'form'; S.editId = null;
      S.form = Object.assign(blankForm(), { name: c.name, phone: c.phone });
      render();
    },
    editRecord: (el) => {
      const r = S.data.records.find(x => x.id === el.dataset.id);
      const c = custOf(r.customerId) || { name: '', phone: '' };
      S.dialog = 'form'; S.editId = r.id;
      S.form = {
        name: c.name, phone: c.phone, food: r.food,
        total: String(r.total), paid: String(r.paid),
        dueDate: r.dueDate || '', dueTime: r.dueTime || '', note: r.note || ''
      };
      render();
    },
    deleteRecord: (el) => {
      commit(Object.assign({}, S.data, { records: S.data.records.filter(x => x.id !== el.dataset.id) }));
      toast(t('Record deleted'));
    },
    deleteCustomer: (el) => {
      const id = el.dataset.id;
      const c = custOf(id);
      if (!c) return;
      const acc = account(c);
      if (acc.remaining > 0.001) {
        if (!confirm(`Macmiilkan (${c.name}) wuxuu leeyahay haraa ku maqan oo dhan ${money(acc.remaining)}. Ma hubtaa inaad tirtirto?`)) {
          return;
        }
      } else {
        if (!confirm(`Ma hubtaa inaad tirtirto macmiilka: ${c.name}?`)) {
          return;
        }
      }
      commit(Object.assign({}, S.data, {
        customers: S.data.customers.filter(x => x.id !== id),
        records: S.data.records.filter(r => r.customerId !== id),
        payments: (S.data.payments || []).filter(p => p.customerId !== id)
      }));
      if (S.customerId === id) { S.screen = 'customers'; S.customerId = null; }
      if (S.expanded === id) S.expanded = null;
      vibrate(20);
      toast(`Macmiilka ${c.name} waa la tirtiray`);
    },
    pickChip: (el) => {
      S.form.food = el.dataset.food;
      const i = document.getElementById('formFood');
      if (i) { i.value = S.form.food; i.focus(); }
    },
    quickDue: (el) => {
      const d = new Date();
      d.setDate(d.getDate() + Number(el.dataset.days));
      S.form.dueDate = localISO(d);
      if (!S.form.dueTime) S.form.dueTime = '18:00';
      render();
    },
    /* "End of month": the customer pays when the month closes. Land on the
       last day of this month, or — if that day has already arrived or gone —
       the last day of the next one. Months are not all the same length, so
       the 31st of a 30-day month resolves to that month's real last day. */
    endOfMonth: () => {
      const now = new Date();
      let end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      if (end <= now) end = new Date(now.getFullYear(), now.getMonth() + 2, 0);
      S.form.dueDate = localISO(end);
      if (!S.form.dueTime) S.form.dueTime = '20:00';
      render();
    },
    clearDue: () => { S.form.dueDate = ''; S.form.dueTime = ''; render(); },

    openPay: (el) => {
      const c = custOf(el.dataset.id);
      if (!c) return;
      S.dialog = 'pay'; S.payCustomerId = c.id;
      S.payAmount = String(Math.max(0, account(c).remaining));
      S.payNote = 'Cash';
      render();
    },
    payFull: () => setPay(account(custOf(S.payCustomerId)).remaining),
    payHalf: () => setPay(round2(account(custOf(S.payCustomerId)).remaining / 2)),

    closeDialog: () => { S.dialog = null; S.editId = null; render(); },
    backdrop: (el, e) => { if (e.target === el) { S.dialog = null; S.editId = null; render(); } },
    submitRecord: () => submitRecord(),
    submitPayment: () => savePayment(),

    filter: (el) => { S.filter = el.dataset.filter; render(); },
    custFilter: (el) => { S.custFilter = el.dataset.filter; render(); },
    setCustSort: (el) => { S.custSort = el.dataset.sort; render(); },
    settleFullDebt: (el) => {
      const id = el.dataset.id;
      const cust = custOf(id);
      if (!cust) return;
      const acc = account(cust);
      if (acc.remaining <= 0.001) { toast('Macmiilkan ma laha wax haraa ah'); return; }
      if (!confirm(`Ma hubtaa inaad hal mar wada xidho haraaga ${cust.name} oo dhan ${money(acc.remaining)}?`)) return;

      const tDate = today();
      const records = S.data.records.map(r => r.customerId === id ? Object.assign({}, r, { paid: r.total }) : r);
      const payments = S.data.payments.concat([{
        id: 'p' + Date.now(), customerId: id, amount: acc.remaining, date: tDate, note: 'Bixiyay Dhammaan'
      }]);
      commit(Object.assign({}, S.data, { records, payments }));
      vibrate([30, 50, 40]);
      launchConfetti();
      toast(`🎉 Haraaga ${cust.name} (${money(acc.remaining)}) gabi ahaanba waa la bixiyay!`);
    },
    setRukun: (el) => {
      S.form = Object.assign({}, S.form, { isRukun: el.dataset.val === '1' });
      // If editing customer name already exists, update their type too
      const name = (S.form.name || '').trim().toLowerCase();
      if (name) {
        const cust = S.data.customers.find(c => c.name.toLowerCase() === name);
        if (cust) {
          commit(Object.assign({}, S.data, {
            customers: S.data.customers.map(c => c.id === cust.id ? Object.assign({}, c, { isRukun: el.dataset.val === '1' }) : c)
          }));
        }
      }
      const modal = document.querySelector('.modal');
      if (modal) {
        modal.querySelectorAll('[data-act="setRukun"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.val === el.dataset.val)));
      }
    },
    toggleRukun: (el) => {
      const id = el.dataset.id;
      const cust = custOf(id);
      if (!cust) return;
      commit(Object.assign({}, S.data, {
        customers: S.data.customers.map(c => c.id === id ? Object.assign({}, c, { isRukun: !c.isRukun }) : c)
      }));
      vibrate(10);
      toast(cust.isRukun ? 'Waxaa laga beddelay: Deyn Maalinle' : 'Waxaa laga beddelay: Rukun ⭐');
    },

    setLang: (el) => {
      if (S.lang === el.dataset.lang) return;
      saveProfile({ lang: el.dataset.lang });
      document.documentElement.lang = el.dataset.lang;
      // Figures are re-labelled, not re-counted: keep them from replaying.
      numStore.clear(); badgeStore.clear(); firstPaint = false;
      render();
    },
    downloadReportPdf: () => {
      const JsPDF = window.jspdf ? window.jspdf.jsPDF : null;
      if (!JsPDF) { window.print(); return; }

      toast('📄 PDF-ka waxaa loo diyaarinayaa soo dejin degdeg ah...');
      vibrate(15);

      /* ── gather data (mirrors viewReport logic) ──────────────── */
      const servedMonths = Array.from(new Set(
        S.data.records.map(r => r.date.slice(0, 7))
         .concat(S.data.payments.map(p => p.date.slice(0, 7)))
         .filter(Boolean)
      )).sort().reverse();
      const keys = servedMonths.slice();
      if (!keys.includes(today().slice(0, 7))) keys.unshift(today().slice(0, 7));
      const monthKey = S.month === 'all' ? 'all'
        : (S.month && keys.includes(S.month) ? S.month : (keys[0] || today().slice(0, 7)));
      const isAllTime = monthKey === 'all';
      const mLabel = isAllTime ? 'Dhammaan Xilliyada (All Time)' : monthName(monthKey);

      const recs = isAllTime
        ? S.data.records.slice().sort((a, b) => a.date.localeCompare(b.date))
        : S.data.records.filter(r => r.date.startsWith(monthKey)).sort((a, b) => a.date.localeCompare(b.date));
      const pays = isAllTime
        ? (S.data.payments || []).slice().sort((a, b) => a.date.localeCompare(b.date))
        : (S.data.payments || []).filter(p => p.date.startsWith(monthKey)).sort((a, b) => a.date.localeCompare(b.date));

      const total = round2(recs.reduce((s, r) => s + r.total, 0));
      const collected = round2(recs.reduce((s, r) => s + r.paid, 0));
      const outstanding = round2(total - collected);
      const rate = total ? Math.round(collected / total * 100) : 0;

      const mix = { Paid: 0, Partial: 0, Unpaid: 0, Overdue: 0 };
      recs.forEach(r => mix[recStatus(r)]++);

      const custIds = Array.from(new Set(recs.map(r => r.customerId)));
      const monthAccs = custIds.map(id => {
        const rs = recs.filter(r => r.customerId === id);
        const c = custOf(id) || { id, name: 'Unknown', phone: '', isRukun: false };
        const consumed = round2(rs.reduce((s, r) => s + r.total, 0));
        const paid = round2(rs.reduce((s, r) => s + r.paid, 0));
        const rem = round2(consumed - paid);
        return { c, consumed, paid, remaining: rem, count: rs.length,
          status: rem <= 0.001 ? 'Paid in Full' : (rs.filter(isOverdue).length ? 'Overdue' : (paid > 0.001 ? 'Partially Paid' : 'Unpaid'))
        };
      }).sort((a, b) => b.remaining - a.remaining || a.c.name.localeCompare(b.c.name));

      const settled = monthAccs.filter(a => a.remaining <= 0.001);
      const owing   = monthAccs.filter(a => a.remaining > 0.001);
      const cur = S.profile.currency || '$';
      const mn = (n) => cur + (Number.isInteger(round2(n)) ? round2(n) : round2(n).toFixed(2));

      /* ── PDF setup ──────────────────────────────────────────── */
      const pdf = new JsPDF('p', 'mm', 'a4');
      const W = pdf.internal.pageSize.getWidth();   // 210
      const H = pdf.internal.pageSize.getHeight();   // 297
      const M = 14; // margin
      const CW = W - M * 2; // content width
      let y = M;
      let pageNum = 1;

      /* colors */
      const COL = {
        bg:       [243, 233, 219],
        cream:    [255, 253, 250],
        cream2:   [250, 243, 233],
        ink:      [36, 31, 27],
        ink2:     [93, 83, 72],
        ink3:     [139, 129, 117],
        accent:   [198, 113, 57],
        accent7:  [140, 73, 26],
        sage:     [111, 129, 88],
        sage6:    [91, 107, 71],
        danger:   [176, 68, 41],
        white:    [255, 255, 255],
        line:     [220, 208, 192],
        lineLt:   [235, 225, 212],
      };

      const setC = (c) => pdf.setTextColor(c[0], c[1], c[2]);
      const setD = (c) => pdf.setDrawColor(c[0], c[1], c[2]);
      const setF = (c) => pdf.setFillColor(c[0], c[1], c[2]);

      /* page bg & footer */
      function drawPageBg() {
        setF(COL.cream);
        pdf.rect(0, 0, W, H, 'F');
        /* top accent bar */
        setF(COL.accent);
        pdf.rect(0, 0, W, 3, 'F');
        /* bottom footer band */
        setF(COL.cream2);
        pdf.rect(0, H - 14, W, 14, 'F');
        setD(COL.lineLt);
        pdf.line(M, H - 14, W - M, H - 14);
        pdf.setFontSize(7);
        setC(COL.ink3);
        pdf.text((S.profile.name || 'Sahafi Restaurant') + (S.profile.phone ? ' · ' + S.profile.phone : ''), M, H - 7);
        pdf.text('Bog ' + pageNum, W - M, H - 7, { align: 'right' });
      }
      drawPageBg();

      function ensureSpace(need) {
        if (y + need > H - 20) {
          pdf.addPage();
          pageNum++;
          y = M + 4;
          drawPageBg();
        }
      }

      function sectionTitle(text) {
        ensureSpace(14);
        setF(COL.accent);
        pdf.rect(M, y, 3, 8, 'F');
        pdf.setFontSize(11);
        pdf.setFont('helvetica', 'bold');
        setC(COL.ink);
        pdf.text(text, M + 7, y + 6);
        setD(COL.line);
        pdf.line(M, y + 10, W - M, y + 10);
        y += 14;
      }

      /* ── HEADER ─────────────────────────────────────────────── */
      /* accent header band */
      setF(COL.accent);
      pdf.rect(0, 3, W, 38, 'F');
      /* logo circle */
      const logoText = (S.profile.name || 'Sahafi').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
      setF(COL.white);
      pdf.circle(W / 2, 14, 7, 'F');
      pdf.setFontSize(9);
      pdf.setFont('helvetica', 'bold');
      setC(COL.accent);
      pdf.text(logoText, W / 2, 16, { align: 'center' });

      /* restaurant name */
      pdf.setFontSize(16);
      pdf.setFont('helvetica', 'bold');
      setC(COL.white);
      pdf.text(S.profile.name || 'Sahafi Restaurant', W / 2, 28, { align: 'center' });

      /* subtitle */
      pdf.setFontSize(8.5);
      pdf.setFont('helvetica', 'normal');
      pdf.text('WARBIXINTA MAALIYADDEED EE BISHA · ' + mLabel, W / 2, 34, { align: 'center' });
      if (S.profile.phone) {
        pdf.setFontSize(8);
        pdf.text(S.profile.phone, W / 2, 38, { align: 'center' });
      }

      y = 46;

      /* meta row */
      setF(COL.cream2);
      pdf.rect(M, y, CW, 10, 'F');
      pdf.setFontSize(7);
      pdf.setFont('helvetica', 'normal');
      setC(COL.ink2);
      pdf.text('Muddada: ' + mLabel, M + 4, y + 6);
      pdf.text('Taariikhda: ' + dateLong(today()), W / 2, y + 6, { align: 'center' });
      setC(COL.sage6);
      pdf.setFont('helvetica', 'bold');
      pdf.text('Runtii La Xaqiijiyay ✓', W - M - 4, y + 6, { align: 'right' });
      y += 14;

      /* ── EXECUTIVE SUMMARY ──────────────────────────────────── */
      sectionTitle('Kooban Maaliyadeed (Executive Summary)');

      const statBoxW = (CW - 9) / 4;
      const statData = [
        { label: 'Wadarta Lacagaha', value: mn(total), sub: recs.length + ' diiwaano', color: COL.accent },
        { label: 'La Ururiyay', value: mn(collected), sub: rate + '% la bixiyay', color: COL.sage },
        { label: 'Haraaga Ku Maqan', value: mn(outstanding), sub: owing.length + ' macmiil', color: outstanding > 0.001 ? COL.danger : COL.sage },
        { label: 'Macaamiisha', value: String(custIds.length), sub: settled.length + ' dhammaystiray', color: COL.accent },
      ];
      statData.forEach((st, i) => {
        const x = M + i * (statBoxW + 3);
        setF(COL.white);
        pdf.roundedRect(x, y, statBoxW, 24, 2, 2, 'F');
        setF(st.color);
        pdf.rect(x, y, statBoxW, 3, 'F');
        pdf.setFontSize(6.5);
        pdf.setFont('helvetica', 'normal');
        setC(COL.ink3);
        pdf.text(st.label, x + statBoxW / 2, y + 8, { align: 'center' });
        pdf.setFontSize(12);
        pdf.setFont('helvetica', 'bold');
        setC(COL.ink);
        pdf.text(st.value, x + statBoxW / 2, y + 16, { align: 'center' });
        pdf.setFontSize(6);
        pdf.setFont('helvetica', 'normal');
        setC(COL.ink3);
        pdf.text(st.sub, x + statBoxW / 2, y + 21, { align: 'center' });
      });
      y += 28;

      /* collection rate bar */
      ensureSpace(16);
      pdf.setFontSize(7.5);
      pdf.setFont('helvetica', 'bold');
      setC(COL.ink2);
      pdf.text('Heerka Ururinta (Collection Rate): ' + rate + '%', M, y + 4);
      y += 7;
      setF(COL.lineLt);
      pdf.roundedRect(M, y, CW, 4, 1.5, 1.5, 'F');
      if (rate > 0) {
        setF(COL.sage);
        pdf.roundedRect(M, y, Math.max(CW * rate / 100, 3), 4, 1.5, 1.5, 'F');
      }
      y += 9;

      /* ── FINANCIAL BREAKDOWN ────────────────────────────────── */
      sectionTitle('Shaxanka Xisaabaadka (Financial Breakdown)');

      const halfW = (CW - 6) / 2;
      /* Left: progress bars */
      setF(COL.white);
      pdf.roundedRect(M, y, halfW, 30, 2, 2, 'F');
      pdf.setFontSize(7);
      pdf.setFont('helvetica', 'bold');
      setC(COL.ink2);
      pdf.text('Kala Qaybsanaanta Xisaabta:', M + 4, y + 7);
      /* collected bar */
      pdf.setFontSize(6.5);
      pdf.setFont('helvetica', 'normal');
      setC(COL.sage6);
      pdf.text('La Bixiyay (' + rate + '%): ' + mn(collected), M + 4, y + 14);
      setF(COL.lineLt);
      pdf.roundedRect(M + 4, y + 16, halfW - 8, 3, 1, 1, 'F');
      if (rate > 0) { setF(COL.sage); pdf.roundedRect(M + 4, y + 16, Math.max((halfW - 8) * rate / 100, 2), 3, 1, 1, 'F'); }
      /* outstanding bar */
      setC(COL.accent7);
      pdf.text('Haraaga (' + (100 - rate) + '%): ' + mn(outstanding), M + 4, y + 23);
      setF(COL.lineLt);
      pdf.roundedRect(M + 4, y + 25, halfW - 8, 3, 1, 1, 'F');
      if (100 - rate > 0) { setF(COL.accent); pdf.roundedRect(M + 4, y + 25, Math.max((halfW - 8) * (100 - rate) / 100, 2), 3, 1, 1, 'F'); }

      /* Right: status counts */
      const rx = M + halfW + 6;
      setF(COL.white);
      pdf.roundedRect(rx, y, halfW, 30, 2, 2, 'F');
      pdf.setFontSize(7);
      pdf.setFont('helvetica', 'bold');
      setC(COL.ink2);
      pdf.text('Xaaladda Diiwaanka:', rx + 4, y + 7);
      const statusItems = [
        { label: 'La Bixiyay', val: mix.Paid, col: COL.sage },
        { label: 'Qayb Bixin', val: mix.Partial, col: COL.accent },
        { label: 'Aan La Bixin', val: mix.Unpaid, col: COL.ink3 },
        { label: 'Waqti Dhaafay', val: mix.Overdue, col: COL.danger },
      ];
      const miniBoxW = (halfW - 12) / 2;
      statusItems.forEach((si, i) => {
        const sx = rx + 4 + (i % 2) * (miniBoxW + 4);
        const sy = y + 11 + Math.floor(i / 2) * 10;
        setF(COL.cream2);
        pdf.roundedRect(sx, sy, miniBoxW, 8, 1, 1, 'F');
        pdf.setFontSize(10);
        pdf.setFont('helvetica', 'bold');
        setC(si.col);
        pdf.text(String(si.val), sx + 3, sy + 6);
        pdf.setFontSize(6);
        pdf.setFont('helvetica', 'normal');
        setC(COL.ink3);
        pdf.text(si.label, sx + 14, sy + 5.5);
      });
      y += 35;

      /* ── TABLE HELPER ──────────────────────────────────────── */
      function drawTable(headers, rows, colWidths, options) {
        const opts = options || {};
        const rowH = opts.rowHeight || 6;
        const headerH = 7;

        ensureSpace(headerH + rowH + 4);

        /* header row */
        setF(COL.accent);
        pdf.rect(M, y, CW, headerH, 'F');
        pdf.setFontSize(6.5);
        pdf.setFont('helvetica', 'bold');
        setC(COL.white);
        let hx = M + 2;
        headers.forEach((h, i) => {
          const align = (opts.aligns && opts.aligns[i]) || 'left';
          const tx = align === 'right' ? hx + colWidths[i] - 2 : (align === 'center' ? hx + colWidths[i] / 2 : hx);
          pdf.text(h, tx, y + 5, { align });
          hx += colWidths[i];
        });
        y += headerH;

        /* data rows */
        rows.forEach((row, ri) => {
          ensureSpace(rowH + 2);
          setF(ri % 2 === 0 ? COL.white : COL.cream2);
          pdf.rect(M, y, CW, rowH, 'F');
          pdf.setFontSize(6.5);
          pdf.setFont('helvetica', 'normal');
          let cx = M + 2;
          row.forEach((cell, ci) => {
            const align = (opts.aligns && opts.aligns[ci]) || 'left';
            const color = (opts.cellColors && opts.cellColors[ri] && opts.cellColors[ri][ci]) || COL.ink;
            setC(color);
            if (opts.boldCols && opts.boldCols.includes(ci)) pdf.setFont('helvetica', 'bold');
            else pdf.setFont('helvetica', 'normal');
            const tx = align === 'right' ? cx + colWidths[ci] - 2 : (align === 'center' ? cx + colWidths[ci] / 2 : cx);
            const cellText = String(cell || '—');
            const maxChars = Math.floor(colWidths[ci] / 2);
            pdf.text(cellText.length > maxChars ? cellText.slice(0, maxChars - 1) + '..' : cellText, tx, y + 4.2, { align });
            cx += colWidths[ci];
          });
          y += rowH;
        });

        /* bottom line */
        setD(COL.line);
        pdf.line(M, y, W - M, y);
        y += 4;
      }

      /* ── CUSTOMER ACCOUNTS TABLE ────────────────────────────── */
      if (monthAccs.length > 0) {
        sectionTitle('Xisaabaadka Macaamiisha (' + monthAccs.length + ' macmiil)');
        const cHeaders = ['Macmiilka', 'Nooc', 'Taleefanka', 'Cuntada', 'La Bixiyay', 'Haraaga', 'Xaaladda'];
        const cWidths = [CW * 0.20, CW * 0.11, CW * 0.14, CW * 0.14, CW * 0.14, CW * 0.14, CW * 0.13];
        const cAligns = ['left', 'center', 'left', 'right', 'right', 'right', 'center'];
        const cRows = monthAccs.map(a => [
          a.c.name,
          a.c.isRukun ? 'Rukun' : 'Deyn',
          a.c.phone || '—',
          mn(a.consumed),
          mn(a.paid),
          mn(a.remaining),
          a.status === 'Paid in Full' ? 'La Bixiyay' : (a.status === 'Overdue' ? 'Dhaafay' : (a.status === 'Partially Paid' ? 'Qayb' : 'Aan Bixin'))
        ]);
        const cColors = monthAccs.map(a => {
          const sc = a.status === 'Paid in Full' ? COL.sage6 : (a.status === 'Overdue' ? COL.danger : COL.ink);
          return [COL.ink, COL.accent, COL.ink3, COL.ink, COL.sage6, a.remaining > 0.001 ? COL.danger : COL.sage6, sc];
        });
        drawTable(cHeaders, cRows, cWidths, { aligns: cAligns, cellColors: cColors, boldCols: [0, 5] });
      }

      /* ── TRANSACTION HISTORY TABLE ─────────────────────────── */
      if (recs.length > 0) {
        sectionTitle('Taariikhda Waxqabadka (' + recs.length + ' diiwaano)');
        const tHeaders = ['Taariikh', 'Macmiilka', 'Cuntada', 'Qaddarka', 'La Bixiyay', 'Haraaga', 'Xaaladda'];
        const tWidths = [CW * 0.13, CW * 0.18, CW * 0.18, CW * 0.13, CW * 0.13, CW * 0.13, CW * 0.12];
        const tAligns = ['left', 'left', 'left', 'right', 'right', 'right', 'center'];
        const tRows = recs.map(r => {
          const c = custOf(r.customerId) || { name: 'Unknown' };
          const st = recStatus(r);
          return [
            r.date,
            c.name,
            r.food || '—',
            mn(r.total),
            mn(r.paid),
            mn(r.total - r.paid),
            st === 'Paid' ? 'La Bixiyay' : (st === 'Overdue' ? 'Dhaafay' : (st === 'Partial' ? 'Qayb' : 'Aan Bixin'))
          ];
        });
        const tColors = recs.map(r => {
          const st = recStatus(r);
          const sc = st === 'Paid' ? COL.sage6 : (st === 'Overdue' ? COL.danger : COL.ink3);
          return [COL.ink3, COL.ink, COL.ink2, COL.ink, COL.sage6, (r.total - r.paid) > 0.001 ? COL.danger : COL.sage6, sc];
        });
        drawTable(tHeaders, tRows, tWidths, { aligns: tAligns, cellColors: tColors, boldCols: [1, 5] });
      }

      /* ── PAYMENTS RECEIVED TABLE ───────────────────────────── */
      if (pays.length > 0) {
        const payTotal = round2(pays.reduce((s, p) => s + p.amount, 0));
        sectionTitle('Lacagaha La Helay (' + mn(payTotal) + ')');
        const pHeaders = ['Taariikh', 'Macmiilka', 'Habka', 'Lacagta'];
        const pWidths = [CW * 0.20, CW * 0.30, CW * 0.25, CW * 0.25];
        const pAligns = ['left', 'left', 'left', 'right'];
        const pRows = pays.map(p => {
          const c = custOf(p.customerId) || { name: 'Unknown' };
          return [p.date, c.name, p.note || 'Cash', mn(p.amount)];
        });
        const pColors = pays.map(() => [COL.ink3, COL.ink, COL.ink2, COL.sage6]);
        drawTable(pHeaders, pRows, pWidths, { aligns: pAligns, cellColors: pColors, boldCols: [1, 3] });
      }

      /* ── CLOSING SUMMARY ────────────────────────────────────── */
      sectionTitle('Kooban Xidhitaanka (Closing Summary)');
      ensureSpace(50);

      setF(COL.cream2);
      pdf.roundedRect(M, y, CW, 40, 2, 2, 'F');
      setD(COL.line);
      pdf.roundedRect(M, y, CW, 40, 2, 2, 'S');

      const sumLeft = [
        ['Wadarta waxqabadka cuntada:', String(recs.length)],
        ['Macaamiisha adeegay:', String(custIds.length)],
        ['Kuwa dhammaystiray:', String(settled.length)],
        ['Kuwa weli deynta ku jira:', String(owing.length)],
      ];
      const sumRight = [
        ['Wadarta lacagaha:', mn(total)],
        ['Wadarta la ururiyay:', mn(collected)],
        ['Haraaga ku maqan:', mn(outstanding)],
        ['Miisaaniyada xidhitaanka:', mn(outstanding)],
      ];

      pdf.setFontSize(7.5);
      sumLeft.forEach((row, i) => {
        pdf.setFont('helvetica', 'normal');
        setC(COL.ink2);
        pdf.text(row[0], M + 6, y + 8 + i * 8);
        pdf.setFont('helvetica', 'bold');
        setC(COL.ink);
        pdf.text(row[1], M + halfW - 6, y + 8 + i * 8, { align: 'right' });
      });
      sumRight.forEach((row, i) => {
        pdf.setFont('helvetica', 'normal');
        setC(COL.ink2);
        pdf.text(row[0], M + halfW + 10, y + 8 + i * 8);
        pdf.setFont('helvetica', 'bold');
        setC(i === 3 ? COL.accent : COL.ink);
        if (i === 3) pdf.setFontSize(9);
        pdf.text(row[1], W - M - 6, y + 8 + i * 8, { align: 'right' });
        if (i === 3) pdf.setFontSize(7.5);
      });
      y += 46;

      /* ── SIGNATURE & STAMP ─────────────────────────────────── */
      ensureSpace(40);
      setD(COL.line);
      pdf.setLineDashPattern([2, 1.5], 0);
      pdf.line(M, y, W - M, y);
      pdf.setLineDashPattern([], 0);
      y += 8;

      /* signature line */
      const sigX = M + 10;
      setD(COL.ink);
      pdf.line(sigX, y + 10, sigX + 55, y + 10);
      pdf.setFontSize(7);
      pdf.setFont('helvetica', 'bold');
      setC(COL.ink);
      pdf.text('Saxiixa Maamulka', sigX + 27.5, y + 16, { align: 'center' });
      pdf.setFontSize(6);
      pdf.setFont('helvetica', 'normal');
      setC(COL.ink3);
      pdf.text('General Manager Signature', sigX + 27.5, y + 20, { align: 'center' });

      /* stamp circle */
      const stampX = W - M - 30;
      setD(COL.accent);
      pdf.setLineDashPattern([1.5, 1], 0);
      pdf.circle(stampX, y + 8, 10, 'S');
      pdf.setLineDashPattern([], 0);
      pdf.setFontSize(5.5);
      pdf.setFont('helvetica', 'bold');
      setC(COL.accent);
      pdf.text('SHAAMBADDA', stampX, y + 6, { align: 'center' });
      pdf.text('RASMIGA AH', stampX, y + 10, { align: 'center' });
      pdf.setFontSize(6);
      pdf.setFont('helvetica', 'normal');
      setC(COL.ink);
      pdf.text('Shaambadda Rasmiga', stampX, y + 22, { align: 'center' });
      pdf.setFontSize(5.5);
      setC(COL.ink3);
      pdf.text('Official Restaurant Stamp', stampX, y + 26, { align: 'center' });

      /* ── SAVE ───────────────────────────────────────────────── */
      const restName = (S.profile.name || 'Sahafi_Restaurant').replace(/\s+/g, '_');
      const filename = 'Warbixinta_' + restName + '_' + (S.month || today().slice(0, 7)) + '.pdf';
      pdf.save(filename);
      toast('✅ Warbixinta PDF-ka si guul leh ayaa loo soo dejiyay!');
      vibrate([20, 30, 20]);
      launchConfetti();
    },
    print: () => window.print(),
    pickLogo: () => { const i = document.getElementById('logoInput'); if (i) i.click(); },
    removeLogo: () => { saveProfile({ logo: '' }); render(); toast(t('Logo removed')); },
    reset: () => {
      commit(seed());
      S.screen = 'dashboard'; S.customerId = null; S.expanded = null;
      numStore.clear(); badgeStore.clear();
      render();
      toast(t('Demo data restored'));
    },

    addFood: () => {
      const input = document.getElementById('newFoodInput');
      const val = (input ? input.value : '').trim();
      if (!val) return;
      const existing = (S.data.foods || []).concat(CHIPS);
      if (existing.some(f => f.toLowerCase() === val.toLowerCase())) {
        toast(t('Food saved to your list')); return;
      }
      commit(Object.assign({}, S.data, { foods: (S.data.foods || []).concat([val]) }));
      toast(t('Food saved to your list'));
    },

    deleteFood: (el) => {
      const food = el.dataset.food;
      const current = (S.data.foods && S.data.foods.length > 0) ? S.data.foods : CHIPS.slice();
      commit(Object.assign({}, S.data, {
        foods: current.filter(f => f.toLowerCase() !== food.toLowerCase())
      }));
      vibrate(12);
      toast(t('Remove food'));
    }
  };

  function setPay(v) {
    S.payAmount = String(Math.max(0, v));
    const i = document.getElementById('payAmount');
    if (i) i.value = S.payAmount;
    updatePayPreview();
  }

  function updatePayPreview() {
    const c = custOf(S.payCustomerId);
    const box = document.getElementById('payPreview');
    if (!c || !box) return;
    const a = account(c);
    const entered = round2(S.payAmount);
    const after = round2(Math.max(0, a.remaining - entered));
    const clears = entered > 0 && after <= 0.001;
    box.style.background = clears ? 'var(--sage-100)' : 'var(--solid-2)';
    box.style.borderColor = clears ? 'var(--sage-200)' : 'var(--glass-edge)';
    box.innerHTML = clears
      ? F.clearsAccount(esc(a.name.split(' ')[0]))
      : F.remainingAfter(money(after));
  }

  /* Logos are downscaled to 256px and stored as a data URL, so the demo
     survives a refresh without pushing localStorage past its quota. */
  function handleLogo(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast(t('That file is not an image')); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const src = String(reader.result);
      if (/^data:image\/svg/.test(src)) { saveProfile({ logo: src }); render(); toast(t('Logo updated')); return; }
      const img = new Image();
      img.onload = () => {
        const max = 256;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        try { saveProfile({ logo: cv.toDataURL('image/png') }); }
        catch (e) { toast(t('That image could not be saved')); return; }
        render();
        toast(t('Logo updated'));
      };
      img.onerror = () => toast(t('That image could not be read'));
      img.src = src;
    };
    reader.readAsDataURL(file);
  }

  /* ══ render ═════════════════════════════════════════════════════ */
  const SCREENS = {
    dashboard: viewDashboard, rent: viewRent, customers: viewCustomers,
    detail: viewDetail, report: viewReport, settings: viewSettings
  };
  let lastDialog = null;

  function render() {
    const desktop = S.width >= 1024;                 // sidebar appears here
    const v = { desktop, tablet: S.width >= 768 && !desktop, wide: S.width >= 1300 };

    const dialogOpened = S.dialog && S.dialog !== lastDialog;
    lastDialog = S.dialog;
    const active = document.activeElement;
    const focusId = dialogOpened ? null : (active && active.id ? active.id : null);
    const caret = focusId && active && 'selectionStart' in active ? active.selectionStart : null;
    // A background repaint (the overdue tick) must not throw the page to the top.
    const scrollY = window.scrollY;

    document.getElementById('root').innerHTML =
      '<div class="shell" style="flex-direction:' + (desktop ? 'row' : 'column') + '">' +
        (desktop ? viewSidebar() : viewMobileBar()) +
        '<main class="main">' + (SCREENS[S.screen] || viewDashboard)(v) + '</main>' +
        (desktop ? '' : viewTabBar()) +
      '</div>' +
      (S.dialog === 'form' ? viewFormDialog() : '') +
      (S.dialog === 'quickAdd' ? viewQuickAddDialog() : '') +
      (S.dialog === 'pay' ? viewPayDialog() : '') +
      viewToast();

    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) {
        el.focus();
        if (caret != null) { try { el.setSelectionRange(caret, caret); } catch (e) {} }
      }
    } else if (S.dialog === 'form' || S.dialog === 'quickAdd') {
      const el = document.getElementById('formName'); if (el) el.focus();
    } else if (S.dialog === 'pay') {
      const el = document.getElementById('payAmount'); if (el) { el.focus(); el.select(); }
    }

    if (scrollY && !dialogOpened) window.scrollTo(0, scrollY);

    runAnimations();
  }

  /* ══ events ═════════════════════════════════════════════════════ */
  /* Tactile feedback on every control, keyed off the actual contact point. */
  document.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.btn, .chip, .icon-btn, .seg-opt, .nav-item, .tab-item, .lang-opt, .btn-whatsapp');
    if (!el || reduceMotion()) return;
    const r = el.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 0.9;
    const dot = document.createElement('span');
    dot.className = 'rip';
    dot.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' +
      (e.clientX - r.left - size / 2) + 'px;top:' + (e.clientY - r.top - size / 2) + 'px';
    el.appendChild(dot);
    setTimeout(() => dot.remove(), 520);
  }, { passive: true });

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const fn = actions[el.dataset.act];
    if (!fn) return;
    if (el.dataset.act !== 'backdrop') e.stopPropagation();
    fn(el, e);
  });

  const FORM_FIELDS = {
    formName: 'name', formPhone: 'phone', formFood: 'food', formTotal: 'total',
    formPaid: 'paid', formDueDate: 'dueDate', formDueTime: 'dueTime', formNote: 'note'
  };
  const PROFILE_FIELDS = { pName: 'name', pPhone: 'phone', pCurrency: 'currency' };

  let _searchDebounce = null;
  document.addEventListener('input', (e) => {
    const t = e.target;

    if (t.id === 'rentSearch') {
      S.search = t.value;
      clearTimeout(_searchDebounce);
      _searchDebounce = setTimeout(render, 100);
      return;
    }
    if (t.id === 'custSearch') {
      S.custSearch = t.value;
      clearTimeout(_searchDebounce);
      _searchDebounce = setTimeout(render, 100);
      return;
    }
    if (t.id === 'payAmount')  { S.payAmount = t.value; updatePayPreview(); return; }
    if (t.id === 'payNote')    { S.payNote = t.value; return; }

    if (PROFILE_FIELDS[t.id]) {
      const key = PROFILE_FIELDS[t.id];
      saveProfile({ [key]: key === 'currency' ? (t.value || '$') : t.value });
      // Name and currency are echoed all over the shell; repaint for those.
      if (key !== 'phone') render();
      return;
    }

    const key = FORM_FIELDS[t.id];
    if (!key) return;
    S.form[key] = t.value;

    if (key === 'name') {
      const match = S.data.customers.find(c => c.name.toLowerCase() === t.value.trim().toLowerCase());
      if (match) {
        S.form.phone = match.phone;
        const phone = document.getElementById('formPhone');
        if (phone && phone !== document.activeElement) phone.value = match.phone;
      }
    }
    if (key === 'total' || key === 'paid') {
      const out = document.getElementById('formHaraa');
      if (out) out.textContent = money(Math.max(0, round2(S.form.total) - round2(S.form.paid)));
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'monthSelect') { S.month = e.target.value; render(); }
    if (e.target.id === 'custSort')    { S.custSort = e.target.value; render(); }
    if (e.target.id === 'logoInput')   { handleLogo(e.target.files && e.target.files[0]); }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && S.dialog) { S.dialog = null; S.editId = null; render(); return; }

    // Enter in the food-add input (Settings page, no dialog open)
    if (e.key === 'Enter' && e.target && e.target.id === 'newFoodInput') {
      e.preventDefault();
      actions.addFood();
      return;
    }

    if (e.key !== 'Enter' || !S.dialog) return;
    if (e.target && e.target.tagName === 'BUTTON') return;   // let the button act
    e.preventDefault();
    if (S.dialog === 'form' || S.dialog === 'quickAdd') submitRecord();
    else if (S.dialog === 'pay') savePayment();
  });

  function onResize() {
    const w = document.documentElement.clientWidth || window.innerWidth;
    const crossed = (S.width >= 1024) !== (w >= 1024) ||
                    (S.width >= 768) !== (w >= 768) ||
                    (S.width >= 1300) !== (w >= 1300);
    S.width = w;
    if (crossed) render();
  }
  window.addEventListener('resize', onResize);

  document.documentElement.lang = S.lang;

  // Persist the seeded book on first run so a refresh restores exactly what
  // is on screen, not a freshly generated copy.
  try {
    if (!localStorage.getItem(DATA_KEY)) localStorage.setItem(DATA_KEY, JSON.stringify(S.data));
    if (!localStorage.getItem(PROFILE_KEY)) localStorage.setItem(PROFILE_KEY, JSON.stringify(S.profile));
  } catch (e) {}

  /* Statuses drift into "overdue" with the clock, so re-check each minute. */
  setInterval(() => { if (!S.dialog) render(); }, 60000);

  render();
})();
</script>
</body>
</html>
